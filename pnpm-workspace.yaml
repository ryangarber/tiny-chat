packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@google/genai": true
  "@mongodb-js/zstd": true
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: true
  node-liblzma: true
  node-pty: true
  onnxruntime-node: true
  prisma: true
  protobufjs: true
  sharp: true
  tesseract.js: true
  tree-sitter-bash: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - "@ryangarber/*"
  - "@afmize/*"
  - "@prisma/*"
  - prisma
  - better-ink-picture
  - better-auth-prisma-orm
  - prisma-orm-extension-zod
  - ink-nightly
  - electrobun-menu
  - computah
peerDependencyRules:
  allowedVersions:
    "@browser-ai/web-llm>ai": "7"
    "capnp-es>typescript": "7"
    "alchemy>mysql2": "3"
    "@better-fetch/fetch": "1"
    "vitest": "5"
    "better-auth>prisma": "*"
    "@better-auth/prisma-adapter>prisma": "*"
overrides:
  effect: "^4.0.5"
  ink: "npm:ink-nightly"
catalogs:
  typescript:
    "typescript": "7.1.0-beta"
  react:
    "react": "^19.3.1"
    "react-dom": "^19.3.1"
    "@types/react": "^19.3.0"
    "@types/react-dom": "^19.3.0"
    "react-devtools-core": "^8.0.0"
    "babel-plugin-react-compiler": "^1.0.0"
  prisma:
    "prisma": 8.0.0-rc.33
    "@prisma/orm-postgres": 8.0.0-rc.23
    "@prisma/orm-extension-paradedb": 8.0.0-rc.23
    "@prisma/orm-extension-pgvector": npm:@ryangarber/prisma-orm-extension-pgvector@8.0.0-rc.23
    "prisma-orm-extension-zod": 0.3.1
    "better-auth-prisma-orm": 0.2.0
  ai:
    "ai": ^7.0.169
    "@ai-sdk/amazon-bedrock": ^5.0.138
    "@ai-sdk/anthropic": ^4.0.102
    "@ai-sdk/azure": ^4.0.122
    "@ai-sdk/google": ^4.0.117
    "@ai-sdk/openai": ^4.0.114
    "@ai-sdk/openai-compatible": ^3.0.90
    "@ai-sdk/provider": ^4.0.37
    "@anthropic-ai/sdk": ^1.8.0
    "openai": ^7.55.0
    "voyage-ai-provider": "^5.0.0"
    "@ryangarber/ai-sdk-providers": ^0.1.6
    "@afmize/node": "^1.1.0"
    "@afmize/capacitor": "^1.1.0"
