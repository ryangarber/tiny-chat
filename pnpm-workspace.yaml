packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@google/genai": true
  "@mongodb-js/zstd": true
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: true
  node-liblzma: true
  node-pty: true
  onnxruntime-node: true
  prisma: true
  protobufjs: true
  sharp: true
  tesseract.js: true
  tree-sitter-bash: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - "@ryangarber/*"
  - "@prisma/*"
  - prisma
  - "@crowecawcaw/xa11y-darwin-arm64@0.15.3"
  - "@crowecawcaw/xa11y-darwin-x64@0.15.3"
  - "@crowecawcaw/xa11y-linux-arm64-gnu@0.15.3"
  - "@crowecawcaw/xa11y-linux-x64-gnu@0.15.3"
  - "@crowecawcaw/xa11y-win32-arm64-msvc@0.15.3"
  - "@crowecawcaw/xa11y-win32-x64-msvc@0.15.3"
  - "@crowecawcaw/xa11y@0.15.3"
peerDependencyRules:
  allowedVersions:
    "@browser-ai/web-llm>ai": "7"
    "capnp-es>typescript": "7"
    "alchemy>mysql2": "3"
    "@better-fetch/fetch": "1"
    "vitest": "5"
    "better-auth>prisma": "*"
    "@better-auth/prisma-adapter>prisma": "*"
overrides:
  "conventional-changelog-writer": "^9.1.1"
  "effect": "4.0.0-rc.115"
catalogs:
  typescript:
    "typescript": "^7.0.2"
  prisma:
    "prisma": "8.0.0-rc.23"
    "@prisma/orm-postgres": "8.0.0-rc.18"
    "@prisma/orm-extension-paradedb": "8.0.0-rc.18"
    "@prisma/orm-extension-pgvector": "npm:@ryangarber/prisma-orm-extension-pgvector@8.0.0-rc.18"
    "@ryangarber/prisma-orm-extension-zod": "0.2.9"
    "@ryangarber/better-auth-adapter-prisma": "0.1.9"
patchedDependencies:
  '@alcalzone/ansi-tokenize@0.3.1': patches/@alcalzone__ansi-tokenize@0.3.1.patch
  ink@8.0.0: patches/ink@8.0.0.patch
  native-run: patches/native-run.patch
