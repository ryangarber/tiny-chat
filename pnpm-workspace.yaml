packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@google/genai": true
  "@mongodb-js/zstd": true
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: true
  node-liblzma: true
  node-pty: true
  onnxruntime-node: true
  prisma: true
  protobufjs: true
  sharp: true
  tesseract.js: true
  tree-sitter-bash: true
  unrs-resolver: true
  workerd: true
  ink@git+https://github.com/vadimdemedes/ink.git: true
minimumReleaseAgeExclude:
  - "@ryangarber/*"
  - "@prisma/*"
  - prisma
  - "@crowecawcaw/xa11y-darwin-arm64@0.15.3"
  - "@crowecawcaw/xa11y-darwin-x64@0.15.3"
  - "@crowecawcaw/xa11y-linux-arm64-gnu@0.15.3"
  - "@crowecawcaw/xa11y-linux-x64-gnu@0.15.3"
  - "@crowecawcaw/xa11y-win32-arm64-msvc@0.15.3"
  - "@crowecawcaw/xa11y-win32-x64-msvc@0.15.3"
  - "@crowecawcaw/xa11y@0.15.3"
peerDependencyRules:
  allowedVersions:
    "@browser-ai/web-llm>ai": "7"
    "capnp-es>typescript": "7"
    "alchemy>mysql2": "3"
    "@better-fetch/fetch": "1"
    "vitest": "5"
    "better-auth>prisma": "*"
    "@better-auth/prisma-adapter>prisma": "*"
overrides:
  effect: "^4.0.5"
  ink: "github:vadimdemedes/ink#1f40c53b151e2accaa5c32fd8c8e07651c1eb6bb"
catalogs:
  typescript:
    "typescript": "^7.0.2"
  react:
    "react": "^19.3.1"
    "react-dom": "^19.3.1"
    "@types/react": "^19.3.0"
    "@types/react-dom": "^19.3.0"
    "react-devtools-core": "^8.0.0"
    "babel-plugin-react-compiler": "^1.0.0"
  prisma:
    "prisma": "8.0.0-rc.28"
    "@prisma/orm-postgres": "8.0.0-rc.21"
    "@prisma/orm-extension-paradedb": "8.0.0-rc.21"
    "@prisma/orm-extension-pgvector": "npm:@ryangarber/prisma-orm-extension-pgvector@8.0.0-rc.21"
    "@ryangarber/prisma-orm-extension-zod": "0.2.13"
    "@ryangarber/better-auth-adapter-prisma": "0.1.13"
patchedDependencies:
  native-run: patches/native-run.patch
