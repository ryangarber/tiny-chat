name: deploy
on:
  workflow_call:
    inputs:
      version:
        description: "Version number to use for the release tag/name"
        required: true
        type: string
      ref:
        description: "What to deploy, if not the version's tag"
        required: false
        type: string
      dry_run:
        description: "Stage the deployment, but leave the live one running"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version number to use for the release tag/name (defaults to package.json)"
        required: false
        type: string
      ref:
        description: "What to deploy, if not the version's tag"
        required: false
        type: string
      dry_run:
        description: "Stage the deployment, but leave the live one running"
        required: false
        type: boolean
        default: false

env:
  # Always, off main.
  DRY_RUN: ${{ inputs.dry_run || github.ref_name != 'main' }}
  REF: ${{ inputs.ref || inputs.version || github.ref }}

jobs:
  predeploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}

      - name: Install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Create .env
        run: |
          cat << EOF > .env
          PG_HOST=${{ secrets.PG_HOST }}
          PG_PORT=${{ secrets.PG_PORT }}
          PG_USER=${{ secrets.PG_USER }}
          PG_PASSWORD=${{ secrets.PG_PASSWORD }}
          PG_DATABASE=${{ secrets.PG_DATABASE }}
          VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL }}
          VITE_SERVER_PORT=${{ secrets.VITE_SERVER_PORT }}
          VITE_WEB_URL=${{ secrets.VITE_WEB_URL }}
          VITE_WEB_PORT=${{ secrets.VITE_WEB_PORT }}
          AUTH_GITHUB_CLIENT=${{ secrets.AUTH_GITHUB_CLIENT }}
          AUTH_GITHUB_SECRET=${{ secrets.AUTH_GITHUB_SECRET }}
          AUTH_GOOGLE_CLIENT=${{ secrets.AUTH_GOOGLE_CLIENT }}
          AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_HUGGINGFACE_CLIENT=${{ secrets.AUTH_HUGGINGFACE_CLIENT }}
          AUTH_HUGGINGFACE_SECRET=${{ secrets.AUTH_HUGGINGFACE_SECRET }}
          EOF

      # A dry run builds a commit whose version rylease never wrote.
      - name: Write version
        if: env.DRY_RUN == 'true' && inputs.version
        run: pnpm pkg set "version=${{ inputs.version }}"

      - name: Prepare deployment
        run: |
          pnpm run build:gui
          cp -r packages/gui/dist apps/web/dist
          tar -czf deploy.tar.gz apps/web/dist

      - name: Upload deployment
        uses: actions/upload-artifact@v7
        with:
          name: deploy
          path: deploy.tar.gz
          retention-days: 7

  deploy:
    runs-on: self-hosted
    needs: predeploy
    environment: production

    steps:
      # A dry run stages everything apart from the live deployment, which it
      # leaves running.
      - name: Checkout
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            TARGET="$RUNNER_TEMP/deploy"
          else
            TARGET="$HOME/deploy"
          fi
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          rm -rf "$TARGET" || true
          # By fetch rather than `clone --branch`, which takes neither a commit
          # (a dry run's) nor a full ref.
          git init --quiet "$TARGET"
          git -C "$TARGET" fetch --quiet --depth 1 https://github.com/ryangarber/tiny-chat.git "$REF"
          git -C "$TARGET" checkout --quiet FETCH_HEAD

      - name: Download deployment
        uses: actions/download-artifact@v8
        with:
          name: deploy

      - name: Extract deployment
        run: |
          tar -xzf deploy.tar.gz -C "$TARGET"

      - name: Create .env
        run: |
          cd "$TARGET"
          cat << EOF > .env
          PG_HOST=${{ secrets.PG_HOST }}
          PG_PORT=${{ secrets.PG_PORT }}
          PG_USER=${{ secrets.PG_USER }}
          PG_PASSWORD=${{ secrets.PG_PASSWORD }}
          PG_DATABASE=${{ secrets.PG_DATABASE }}
          VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL }}
          VITE_SERVER_PORT=${{ secrets.VITE_SERVER_PORT }}
          VITE_WEB_URL=${{ secrets.VITE_WEB_URL }}
          VITE_WEB_PORT=${{ secrets.VITE_WEB_PORT }}
          AUTH_GITHUB_CLIENT=${{ secrets.AUTH_GITHUB_CLIENT }}
          AUTH_GITHUB_SECRET=${{ secrets.AUTH_GITHUB_SECRET }}
          AUTH_GOOGLE_CLIENT=${{ secrets.AUTH_GOOGLE_CLIENT }}
          AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_HUGGINGFACE_CLIENT=${{ secrets.AUTH_HUGGINGFACE_CLIENT }}
          AUTH_HUGGINGFACE_SECRET=${{ secrets.AUTH_HUGGINGFACE_SECRET }}
          EOF

      - name: Install dependencies
        run: |
          cd "$TARGET"
          pnpm ci

      - name: Activate deployment
        if: env.DRY_RUN != 'true'
        run: |
          cd ~/deploy/packages/server
          pm2 restart pm2.config.mjs --update-env || pm2 start pm2.config.mjs
          cd ~/deploy/apps/web
          pm2 restart pm2.config.mjs --update-env || pm2 start pm2.config.mjs
          pm2 save

      - name: Print deployment
        if: env.DRY_RUN == 'true'
        run: |
          {
            echo "### Dry run: ${{ inputs.version }}"
            echo
            echo "Staged \`$REF\` in \`$TARGET\` with its dependencies installed. Would replace \`~/deploy\` with it and run:"
            echo
            echo '```sh'
            echo 'cd ~/deploy/packages/server'
            echo 'pm2 restart pm2.config.mjs --update-env || pm2 start pm2.config.mjs'
            echo 'cd ~/deploy/apps/web'
            echo 'pm2 restart pm2.config.mjs --update-env || pm2 start pm2.config.mjs'
            echo 'pm2 save'
            echo '```'
            echo
            echo "pm2 $(pm2 --version)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test -f "$TARGET/packages/server/pm2.config.mjs"
          test -f "$TARGET/apps/web/pm2.config.mjs"
          test -d "$TARGET/apps/web/dist"

      # It holds the production .env.
      - name: Clean up
        if: always() && env.DRY_RUN == 'true'
        run: rm -rf "$TARGET"
