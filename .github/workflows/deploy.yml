name: deploy
on:
  workflow_call:
    inputs:
      version:
        description: "Version number to use for the release tag/name"
        required: true
        type: string
      ref:
        description: "What to deploy, if not the version's tag"
        required: false
        type: string
      dry_run:
        description: "Stage the deployment, but leave the live one running"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version number to use for the release tag/name (defaults to package.json)"
        required: false
        type: string
      ref:
        description: "What to deploy, if not the version's tag"
        required: false
        type: string

env:
  # Always, off main.
  DRY_RUN: ${{ inputs.dry_run || github.ref_name != 'main' }}
  REF: ${{ inputs.ref || inputs.version || github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}

      - name: Install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Create .env
        run: |
          cat << EOF > .env
          PG_HOST=${{ secrets.PG_HOST }}
          PG_PORT=${{ secrets.PG_PORT }}
          PG_USER=${{ secrets.PG_USER }}
          PG_PASSWORD=${{ secrets.PG_PASSWORD }}
          PG_DATABASE=${{ secrets.PG_DATABASE }}
          VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL }}
          VITE_SERVER_PORT=${{ secrets.VITE_SERVER_PORT }}
          VITE_WEB_URL=${{ secrets.VITE_WEB_URL }}
          VITE_WEB_PORT=${{ secrets.VITE_WEB_PORT }}
          AUTH_GITHUB_CLIENT=${{ secrets.AUTH_GITHUB_CLIENT }}
          AUTH_GITHUB_SECRET=${{ secrets.AUTH_GITHUB_SECRET }}
          AUTH_GOOGLE_CLIENT=${{ secrets.AUTH_GOOGLE_CLIENT }}
          AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_HUGGINGFACE_CLIENT=${{ secrets.AUTH_HUGGINGFACE_CLIENT }}
          AUTH_HUGGINGFACE_SECRET=${{ secrets.AUTH_HUGGINGFACE_SECRET }}
          EOF

      # A dry run builds a commit whose version rylease never wrote.
      - name: Write version
        if: env.DRY_RUN == 'true' && inputs.version
        run: pnpm pkg set "version=${{ inputs.version }}"

      - name: Build
        run: pnpm run build:gui

      - name: Set up SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.CI_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.CI_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          cat << EOF > ~/.ssh/config
          Host target
            HostName ${{ secrets.CI_HOSTNAME }}
            User ${{ secrets.CI_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      # A dry run stages everything apart from the live deployment, which it
      # leaves running. Paths are relative to the deploy user's home.
      - name: Pick target
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            TARGET="chat-staging"
          else
            TARGET="chat"
          fi
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      # Stage dist using diff, falling back to copying from live.
      - name: Checkout on host
        run: |
          # shellcheck disable=SC2029 # Quoted with %q for the remote shell.
          ssh target "bash -l -s -- $(printf '%q ' "$TARGET" "$REF")" << 'EOF'
          set -euo pipefail
          TARGET="$1" REF="$2"
          # Fetch exact commit/ref.
          git init --quiet "$TARGET"
          cd "$TARGET"
          git fetch --quiet --depth 1 https://github.com/ryangarber/tiny-chat.git "$REF"
          git checkout --quiet --force FETCH_HEAD
          git clean -ffdxq -e .env -e node_modules -e /apps/web/dist
          if [ "$TARGET" != chat ] && [ ! -d apps/web/dist ] && [ -d ~/chat/apps/web/dist ]; then
            cp -a ~/chat/apps/web/dist apps/web/dist
          fi
          EOF

      - name: Diff deployment
        if: env.DRY_RUN == 'true'
        run: |
          {
            echo "### Dist changes against the live deployment"
            echo
            echo '```'
            rsync --dry-run --recursive --links --checksum --delete --itemize-changes \
              packages/gui/dist/ target:chat/apps/web/dist/ || echo "(no live deployment to diff against)"
            echo '```'
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Checksums so only changed files go over and the summary shows real changes.
      # --delete-after to clean up old files only after they're no longer served.
      - name: Sync deployment
        run: |
          rsync --recursive --links --compress --checksum \
            --delete-after --delay-updates --itemize-changes \
            packages/gui/dist/ target:"$TARGET/apps/web/dist/"
          rsync --checksum --chmod=F600 .env target:"$TARGET/.env"

      - name: Install dependencies on host
        run: |
          # shellcheck disable=SC2029 # Quoted with %q for the remote shell.
          ssh target "bash -l -s -- $(printf '%q ' "$TARGET")" << 'EOF'
          set -euo pipefail
          cd "$1"
          pnpm ci
          EOF

      - name: Activate deployment
        if: env.DRY_RUN != 'true'
        run: |
          ssh target 'bash -l -s' << 'EOF'
          set -euo pipefail
          cd ~/chat/packages/server
          pm2 restart pm2.config.mjs --update-env || pm2 start pm2.config.mjs
          cd ~/chat/apps/web
          pm2 restart pm2.config.mjs --update-env || pm2 start pm2.config.mjs
          pm2 save
          EOF

      - name: Print deployment
        if: env.DRY_RUN == 'true'
        run: |
          # shellcheck disable=SC2029 # Quoted with %q for the remote shell.
          {
            echo "### Dry run: ${{ inputs.version }}"
            echo
            echo "Staged \`$REF\` in \`~/$TARGET\` with its dependencies installed. Would sync it to \`~/chat\` and run:"
            echo
            echo '```sh'
            echo 'cd ~/chat/packages/server'
            echo 'pm2 restart pm2.config.mjs --update-env || pm2 start pm2.config.mjs'
            echo 'cd ~/chat/apps/web'
            echo 'pm2 restart pm2.config.mjs --update-env || pm2 start pm2.config.mjs'
            echo 'pm2 save'
            echo '```'
            echo
            echo "pm2 $(ssh target 'bash -l -c "pm2 --version"')"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # shellcheck disable=SC2029 # Quoted with %q for the remote shell.
          ssh target "bash -l -s -- $(printf '%q ' "$TARGET")" << 'EOF'
          set -euo pipefail
          test -f "$1/packages/server/pm2.config.mjs"
          test -f "$1/apps/web/pm2.config.mjs"
          test -d "$1/apps/web/dist"
          EOF

      # Staging is kept for the next dry run, but not the production .env.
      - name: Clean up
        if: always() && env.DRY_RUN == 'true' && env.TARGET
        run: |
          # shellcheck disable=SC2029 # Quoted with %q for the remote shell.
          ssh target "rm -f $(printf '%q' "$TARGET/.env")"
