name: release-cli

on:
  workflow_call:
    inputs:
      version:
        description: "Version number to use for the release tag/name"
        required: true
        type: string
      notes:
        description: "Release notes/changelog to include in the release body"
        required: false
        type: string
      ref:
        description: "What to build, if not the version's tag"
        required: false
        type: string
      dry_run:
        description: "Build but publish nothing"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version number to use for the release tag/name"
        required: true
        type: string
      notes:
        description: "Release notes/changelog to include in the release body"
        required: false
        type: string
      ref:
        description: "What to build, if not the version's tag"
        required: false
        type: string

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # FoundationModels (afmize) needs the macOS 27 SDK.
          - platform: "xcode-27"
            asset: "Tiny.Chat_CLI_macOS"
          - platform: "ubuntu-latest"
            asset: "Tiny.Chat_CLI_Linux"
          - platform: "windows-latest"
            asset: "Tiny.Chat_CLI_Windows.exe"

    runs-on: ${{ matrix.platform }}
    environment: production
    env:
      # Always, off main.
      DRY_RUN: ${{ inputs.dry_run || github.ref_name != 'main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || inputs.version || github.ref }}
          submodules: recursive

      - name: Install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Create .env
        shell: bash
        run: |
          cat << EOF > .env
          PG_HOST=${{ secrets.PG_HOST }}
          PG_PORT=${{ secrets.PG_PORT }}
          PG_USER=${{ secrets.PG_USER }}
          PG_PASSWORD=${{ secrets.PG_PASSWORD }}
          PG_DATABASE=${{ secrets.PG_DATABASE }}
          VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL }}
          VITE_SERVER_PORT=${{ secrets.VITE_SERVER_PORT }}
          VITE_WEB_URL=${{ secrets.VITE_WEB_URL }}
          VITE_WEB_PORT=${{ secrets.VITE_WEB_PORT }}
          AUTH_GITHUB_CLIENT=${{ secrets.AUTH_GITHUB_CLIENT }}
          AUTH_GITHUB_SECRET=${{ secrets.AUTH_GITHUB_SECRET }}
          AUTH_GOOGLE_CLIENT=${{ secrets.AUTH_GOOGLE_CLIENT }}
          AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_HUGGINGFACE_CLIENT=${{ secrets.AUTH_HUGGINGFACE_CLIENT }}
          AUTH_HUGGINGFACE_SECRET=${{ secrets.AUTH_HUGGINGFACE_SECRET }}
          EOF

      # A dry run builds a commit whose version rylease never wrote.
      - name: Write version
        if: env.DRY_RUN == 'true' && inputs.version
        run: pnpm pkg set "version=${{ inputs.version }}"

      - name: Create Swift cache key
        if: matrix.platform == 'xcode-27'
        id: swift-toolchain
        run: |
          fingerprint=$({
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            xcrun swift --version
          } | shasum -a 256 | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM
        if: matrix.platform == 'xcode-27'
        uses: actions/cache@v6
        with:
          path: vendor/afmize/.build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.fingerprint }}-afmize-${{ hashFiles('vendor/afmize/Package.swift', 'vendor/afmize/Package.resolved', 'vendor/afmize/Sources/**') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.fingerprint }}-afmize-

      # The CLI embeds afmize's dynamic library on macOS. `build:cli` builds it
      # too (and fails in CI without it); this step only keeps its log apart.
      - name: Build afmize
        if: matrix.platform == 'xcode-27'
        run: swift build --package-path vendor/afmize --configuration release --product dynafmize

      - name: Build CLI
        run: pnpm run build:cli

      - name: Package binary
        shell: bash
        run: |
          BIN=$(find apps/cli/dist -maxdepth 1 -name "tiny-chat*" -type f | head -1)
          echo "Found: $BIN"
          cp "$BIN" "$RUNNER_TEMP/${{ matrix.asset }}"

      - name: Publish
        uses: ryangarber/rylease@v3
        with:
          version: ${{ inputs.version }}
          notes: ${{ inputs.notes }}
          dry-run: ${{ env.DRY_RUN }}
          # No preset here to give them.
          scheme: semver
          history: git/tags
          tag: "{version}"
          steps: |
            - uses: github/upload-release-assets
              with:
                files:
                  - '${{ runner.temp }}/${{ matrix.asset }}'
                dryRunArtifact: true
                artifactName: cli-${{ matrix.asset }}

  # What every installed CLI checks for a release (`UpdateService.check`),
  # under the name Tauri's updater gave it, so builds already out there still
  # find it. Only once every binary is up, so no CLI is told of a release it
  # cannot yet download.
  manifest:
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run || github.ref_name != 'main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || inputs.version || github.ref }}

      - name: Write manifest
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: printf '{"version":"%s"}\n' "$VERSION" > "$RUNNER_TEMP/latest.json"

      - name: Publish
        uses: ryangarber/rylease@v3
        with:
          version: ${{ inputs.version }}
          notes: ${{ inputs.notes }}
          dry-run: ${{ env.DRY_RUN }}
          # No preset here to give them.
          scheme: semver
          history: git/tags
          tag: "{version}"
          steps: |
            - uses: github/upload-release-assets
              with:
                files:
                  - '${{ runner.temp }}/latest.json'
                dryRunArtifact: true
                artifactName: cli-latest.json
