name: "release-desktop"

on:
  workflow_call:
    inputs:
      version:
        description: "Version number to use for the release tag/name"
        required: true
        type: string
      notes:
        description: "Release notes/changelog to include in the release body"
        required: false
        type: string
      ref:
        description: "What to build, if not the version's tag"
        required: false
        type: string
      dry_run:
        description: "Build but publish nothing"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version number to use for the release tag/name"
        required: true
        type: string
      notes:
        description: "Release notes/changelog to include in the release body"
        required: false
        type: string
      ref:
        description: "What to build, if not the version's tag"
        required: false
        type: string

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "xcode-27"
          - platform: "ubuntu-latest"
          - platform: "windows-latest"

    runs-on: ${{ matrix.platform }}
    environment: production
    env:
      # Always, off main.
      DRY_RUN: ${{ inputs.dry_run || github.ref_name != 'main' }}
      # Secrets can't be read in an `if`.
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_SIGNING_P12 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || inputs.version || github.ref }}

      - name: Install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Create .env
        shell: bash
        run: |
          cat << EOF > .env
          PG_HOST=${{ secrets.PG_HOST }}
          PG_PORT=${{ secrets.PG_PORT }}
          PG_USER=${{ secrets.PG_USER }}
          PG_PASSWORD=${{ secrets.PG_PASSWORD }}
          PG_DATABASE=${{ secrets.PG_DATABASE }}
          VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL }}
          VITE_SERVER_PORT=${{ secrets.VITE_SERVER_PORT }}
          VITE_WEB_URL=${{ secrets.VITE_WEB_URL }}
          VITE_WEB_PORT=${{ secrets.VITE_WEB_PORT }}
          AUTH_GITHUB_CLIENT=${{ secrets.AUTH_GITHUB_CLIENT }}
          AUTH_GITHUB_SECRET=${{ secrets.AUTH_GITHUB_SECRET }}
          AUTH_GOOGLE_CLIENT=${{ secrets.AUTH_GOOGLE_CLIENT }}
          AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_HUGGINGFACE_CLIENT=${{ secrets.AUTH_HUGGINGFACE_CLIENT }}
          AUTH_HUGGINGFACE_SECRET=${{ secrets.AUTH_HUGGINGFACE_SECRET }}
          EOF

      # A dry run builds a commit whose version rylease never wrote.
      - name: Write version
        if: env.DRY_RUN == 'true' && inputs.version
        run: pnpm pkg set "version=${{ inputs.version }}"

      - name: Cache Electrobun
        uses: actions/cache@v6
        with:
          path: ~/.hutch
          key: ${{ runner.os }}-${{ runner.arch }}-hutch-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-hutch-

      # A stable identity (self-signed is enough) keeps macOS's privacy grants matching the app across updates. Without
      # the secret, the app is built unsigned.
      - name: Import signing identity
        if: runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true'
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$MACOS_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MACOS_SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          echo "ELECTROBUN_DEVELOPER_ID=Tiny Chat Code Signing" >> "$GITHUB_ENV"

      - name: Build app
        run: pnpm build:desktop

      - name: Publish
        uses: ryangarber/rylease@v3
        with:
          version: ${{ inputs.version }}
          notes: ${{ inputs.notes }}
          dry-run: ${{ env.DRY_RUN }}
          # No preset here to give them.
          scheme: semver
          history: git/tags
          tag: "{version}"
          steps: |
            # Under the names Electrobun gave them: the updater looks for
            # `stable-<os>-<arch>-update.json` at the latest release.
            - uses: github/upload-release-assets
              with:
                files:
                  - 'apps/desktop/artifacts/*'
                dryRunArtifact: true
                artifactName: desktop-${{ runner.os }}-${{ runner.arch }}
