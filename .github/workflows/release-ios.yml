name: release-ios

on:
  workflow_call:
    inputs:
      version:
        description: "Version number to use for the release tag/name"
        required: true
        type: string
      notes:
        description: "Release notes/changelog to include in the release body"
        required: false
        type: string
      ref:
        description: "What to build, if not the version's tag"
        required: false
        type: string
      dry_run:
        description: "Build but publish nothing"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version number to use for the release tag/name"
        required: true
        type: string
      notes:
        description: "Release notes/changelog to include in the release body"
        required: false
        type: string
      ref:
        description: "What to build, if not the version's tag"
        required: false
        type: string

jobs:
  release:
    runs-on: xcode-27
    environment: production
    env:
      # Always, off main.
      DRY_RUN: ${{ inputs.dry_run || github.ref_name != 'main' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || inputs.version || github.ref }}
          submodules: recursive

      - name: Create cache key
        id: toolchain
        run: |
          fingerprint=$({
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun swift --version
          } | shasum -a 256 | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-ios-spm-${{ hashFiles('apps/mobile/ios/App/CapApp-SPM/Package.resolved', 'vendor/afmize/Package.resolved') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-ios-spm-

      - name: Install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Create .env
        run: |
          cat << EOF > .env
          PG_HOST=${{ secrets.PG_HOST }}
          PG_PORT=${{ secrets.PG_PORT }}
          PG_USER=${{ secrets.PG_USER }}
          PG_PASSWORD=${{ secrets.PG_PASSWORD }}
          PG_DATABASE=${{ secrets.PG_DATABASE }}
          VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL }}
          VITE_SERVER_PORT=${{ secrets.VITE_SERVER_PORT }}
          VITE_WEB_URL=${{ secrets.VITE_WEB_URL }}
          VITE_WEB_PORT=${{ secrets.VITE_WEB_PORT }}
          AUTH_GITHUB_CLIENT=${{ secrets.AUTH_GITHUB_CLIENT }}
          AUTH_GITHUB_SECRET=${{ secrets.AUTH_GITHUB_SECRET }}
          AUTH_GOOGLE_CLIENT=${{ secrets.AUTH_GOOGLE_CLIENT }}
          AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_HUGGINGFACE_CLIENT=${{ secrets.AUTH_HUGGINGFACE_CLIENT }}
          AUTH_HUGGINGFACE_SECRET=${{ secrets.AUTH_HUGGINGFACE_SECRET }}
          EOF

      # A dry run builds a commit whose version rylease never wrote.
      - name: Write version
        if: env.DRY_RUN == 'true' && inputs.version
        run: pnpm pkg set "version=${{ inputs.version }}"

      - name: Build iOS archive
        run: pnpm build:ios

      - name: Package app
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" \
            -maxdepth 1 -name "*.app" | head -1)
          echo "Packaging: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -9 -r "Tiny.Chat_iOS.ipa" Payload/
          echo "IPA size: $(du -sh Tiny.Chat_iOS.ipa | cut -f1)"

      - name: Publish
        uses: ryangarber/rylease@v3
        with:
          version: ${{ inputs.version }}
          notes: ${{ inputs.notes }}
          dry-run: ${{ env.DRY_RUN }}
          # No preset here to give them.
          scheme: semver
          history: git/tags
          tag: "{version}"
          steps: |
            - uses: github/upload-release-assets
              with:
                files:
                  - '${{ runner.temp }}/Tiny.Chat_iOS.ipa'
                dryRunArtifact: true
                artifactName: ios
